name: Validate release and create PR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch
        required: true
        type: string
      version:
        description: Release version
        required: true
        type: string
      expected_sha:
        description: Version bump commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release branch: $BRANCH"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$VERSION" ]; then
            echo "Branch version does not match requested version: $VERSION"
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "$BRANCH" ]; then
            echo "Workflow ref ($WORKFLOW_REF) does not match release branch ($BRANCH)."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit: $EXPECTED_SHA"
            exit 1
          fi

      - name: Checkout version bump commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Verify release commit and package version
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Checked-out commit does not match expected release commit."
            exit 1
          fi

          package_version="$(python -c 'import runpy; print(runpy.run_path("pytool_proxy_fix/_version.py")["__version__"])')"
          if [ "$package_version" != "$VERSION" ]; then
            echo "Package version ($package_version) does not match release version ($VERSION)."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv tool run twine check dist/*

      - name: Install and verify package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c 'from importlib.metadata import version; import os; assert version("pytool-proxy-fix") == os.environ["VERSION"]'
          python -c 'from pytool_proxy_fix.main import main_fix_urllib; assert callable(main_fix_urllib)'

  create-pr:
    name: Create release PR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify branch still points to validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          branch_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          if [ "$branch_sha" != "$EXPECTED_SHA" ]; then
            echo "Release branch moved during validation: expected $EXPECTED_SHA, found $branch_sha."
            exit 1
          fi

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_pr="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Release PR already exists: #$existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "Automated version bump for pytool-proxy-fix v$VERSION. Release validation: $RUN_URL"
