name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate merged release PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Parse merged release
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release branch: $BRANCH"
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Verify merged commit and package version
        env:
          MERGE_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "Release commit is not on main: $MERGE_SHA"
            exit 1
          fi

          package_version="$(python -c 'import runpy; print(runpy.run_path("pytool_proxy_fix/_version.py")["__version__"])')"
          if [ "$package_version" != "$VERSION" ]; then
            echo "Release branch version ($VERSION) does not match package version ($package_version)."
            exit 1
          fi

  build:
    name: Build distribution
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv tool run twine check dist/*

      - name: Install and verify package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c 'from importlib.metadata import version; import os; assert version("pytool-proxy-fix") == os.environ["VERSION"]'
          python -c 'from pytool_proxy_fix.main import main_fix_urllib; assert callable(main_fix_urllib)'

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytool-proxy-fix
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Create release tag
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "$TAG already points to $tag_sha instead of $RELEASE_SHA."
              exit 1
            fi
          else
            git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Rerunning an identical tagged release is safe; PyPI artifacts remain immutable.
          skip-existing: true

  publish-github:
    name: Create GitHub Release
    needs: [validate, build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes dist/*
          fi

  cleanup-release-branch:
    name: Delete release branch
    needs: [validate, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete release branch if it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.validate.outputs.branch }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
            echo "Deleted release branch: $BRANCH"
          else
            echo "Release branch is already absent: $BRANCH"
          fi
