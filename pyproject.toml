[project]
name = "pytool-proxy-fix"
description = "Fix urllib for Python 3.7/3.8"
readme = "README.md"
requires-python = ">=3.7, <3.9"
license = {text = "MIT"}
authors = [{name = "kites262", email = "kites262@github.com"}]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytool_proxy_fix*"]

[tool.setuptools.dynamic]
version = {attr = "pytool_proxy_fix._version.__version__"}

[project.urls]
Homepage = "https://github.com/kites262/pytool-proxy-fix"
Repository = "https://github.com/kites262/pytool-proxy-fix"

[project.scripts]
pytool-proxy-fix = "pytool_proxy_fix.main:main_fix_urllib"
